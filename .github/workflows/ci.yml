name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # aciona manualmente para o benchmark completo

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2
        # Para repositórios públicos no GitHub.com, o MathWorks fornece MATLAB
        # via GitHub Actions sem custo. Para repositórios privados, configure
        # secrets.MATLAB_LICENSE_TOKEN no repositório e adicione:
        #   with:
        #     license-server: ${{ secrets.MATLAB_LICENSE_TOKEN }}

      - name: Lint (checkcode)
        uses: matlab-actions/run-command@v2
        with:
          command: run('run_lint.m')
        env:
          MATLAB_BATCH: "1"

      - name: Rodar testes
        uses: matlab-actions/run-command@v2
        with:
          command: run('run_tests.m')
        env:
          MATLAB_BATCH: "1"

  ci-benchmarks:
    runs-on: ubuntu-latest
    needs: test  # só roda se os testes passarem

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Benchmark SISO (smoke test)
        uses: matlab-actions/run-command@v2
        with:
          # Config reduzida para CI: popSize=40, nGeracoes=10, 3 seeds
          # Gate: OSA-RMSE val < 0.5 (sanity check, nao threshold de qualidade)
          command: |
            setup;
            opcoes = struct('popSize', 40, 'nGeracoes', 10, 'nSeeds', 3, 'salvarJson', false);
            r = bench_siso(opcoes);
            fprintf('OSA-RMSE val media: %.4g\n', r.rmseOsaValMedia);
            if r.rmseOsaValMedia > 0.5
              error('ci:rmseAlto', 'OSA-RMSE val=%.4g excede gate de 0.5', r.rmseOsaValMedia);
            end
            fprintf('CI benchmark: PASSOU (OSA-RMSE val=%.4g)\n', r.rmseOsaValMedia);
        env:
          MATLAB_BATCH: "1"

  full-benchmarks:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'  # apenas em trigger manual

    steps:
      - uses: actions/checkout@v4

      - name: Setup MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Benchmark completo (performance + NSGA-II)
        uses: matlab-actions/run-command@v2
        with:
          command: |
            setup;
            bench_siso();
            bench_performance();
            bench_nsga2();
        env:
          MATLAB_BATCH: "1"

      - name: Upload resultados
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: dev/benchmarks/results/*.json
